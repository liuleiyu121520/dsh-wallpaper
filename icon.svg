<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Identity: the desktop wallpaper showing *through* the app window.
       A window frame with two window dots, its body filled by a minimal
       landscape band. Deliberately low-detail so it stays legible at 20px.
       Mono/currentColor so the settings row tints it. -->
  <defs>
    <clipPath id="wb-body">
      <rect x="2.4" y="5.4" width="19.2" height="13.4" rx="2.8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#wb-body)">
    <!-- wallpaper sky/land bands -->
    <rect x="2.4" y="8.9" width="19.2" height="9.9" fill="currentColor" opacity=".16"/>
    <path d="M2.4 18.8l5.6-5.5a1.4 1.4 0 0 1 2 0l3.1 3 2-1.9a1.35 1.35 0 0 1 1.9 0l4.6 4.4v2.9H2.4z"
          fill="currentColor" opacity=".5"/>
    <circle cx="17.2" cy="8.9" r="1.6" fill="currentColor" opacity=".5"/>
  </g>

  <!-- frame + title bar -->
  <rect x="2.4" y="5.4" width="19.2" height="13.4" rx="2.8"
        stroke="currentColor" stroke-width="1.6"/>
  <path d="M3 8.9h18" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="5.4" cy="7.15" r=".7" fill="currentColor"/>
  <circle cx="7.6" cy="7.15" r=".7" fill="currentColor"/>
</svg>
