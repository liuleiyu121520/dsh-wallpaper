<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- 身份：一块「壁纸」——蓝色渐变圆角底板 + 白色山景。
       与宿主默认插件图标同一风格（蓝底、白色实心字形、无描边），
       44px 下仍能认出"照片/壁纸"而不是抽象方块。 -->
  <defs>
    <linearGradient id="wb-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#3A5FD9"/>
    </linearGradient>
    <clipPath id="wb-clip">
      <rect width="48" height="48" rx="12"/>
    </clipPath>
  </defs>

  <rect width="48" height="48" rx="12" fill="url(#wb-tile)"/>

  <g clip-path="url(#wb-clip)">
    <!-- 顶部一层极淡高光，纯色块不板结 -->
    <path d="M0 0h48v19c-8 4-16 5.5-24 5.5S8 23 0 19z" fill="#fff" opacity=".08"/>

    <!-- 太阳 -->
    <circle cx="32.6" cy="16.6" r="4.3" fill="#fff"/>

    <!-- 远山（半透明白）+ 近山（纯白） -->
    <path d="M-3 36.5l11-12.1a3.9 3.9 0 0 1 5.9 0L26 36.5z" fill="#fff" opacity=".62"/>
    <path d="M17.5 38.5l9.9-10.8a3.8 3.8 0 0 1 5.7 0L44 38.5z" fill="#fff"/>
  </g>
</svg>
